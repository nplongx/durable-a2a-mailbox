[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-a2a-mailbox"
version = "0.1.1"
description = "SQLite-backed durable A2A mailbox library with host-supplied authentication"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "nplongx" }]
keywords = ["a2a", "mailbox", "sqlite", "messaging", "idempotency"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
]
dependencies = []
license-files = ["LICENSE"]

[tool.setuptools.package-data]
durable_a2a_mailbox = ["py.typed", "TERMINOLOGY.md"]

[tool.setuptools.packages.find]
include = ["durable_a2a_mailbox*"]
